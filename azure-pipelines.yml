trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:
- checkout: self

- task: InstallSSHKey@0
  displayName: "Install EC2 SSH Private Key"
  inputs:
    knownHostsEntry: '$(ec2-host)'
    sshKeySecureFile: 'ec2-privatekey'

- script: |
    ssh -o StrictHostKeyChecking=no $(ec2-user)@$(ec2-host) '
      cd /home/ubuntu/Minishop/ &&
      git pull origin main
    '
  displayName: "Pull latest code on EC2"