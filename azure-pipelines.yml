
trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:
- checkout: self

- script: |
    set -e

    echo "Preparing SSH private key..."

    printf '%s\n' "$EC2_PRIVATE_KEY" | tr -d '\r' > /tmp/ec2-key.pem
    chmod 600 /tmp/ec2-key.pem

    echo "Connecting to EC2..."

    ssh -i /tmp/ec2-key.pem \
      -o StrictHostKeyChecking=no \
      -o BatchMode=yes \
      $(ec2-user)@$(ec2-host) '
        set -e

        echo "Connected to EC2"

        cd /home/ubuntu/Minishop/

        echo "Pulling latest code from GitHub..."
        git pull origin main

        echo "Restarting Nginx..."
        sudo systemctl restart nginx

        echo "Checking Nginx status..."
        sudo systemctl is-active nginx

        echo "Deployment completed successfully!"
      '

    rm -f /tmp/ec2-key.pem

  displayName: "Deploy MiniShop to EC2"
  env:
    EC2_PRIVATE_KEY: $(ec2-privatekey)
